name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-server.txt
      - name: Install
        # server runtime + what the tests and evals import (xgboost for train.py configs)
        run: pip install -r requirements-server.txt xgboost==3.3.0 pytest==9.1.1 httpx==0.28.1
      - name: Unit tests
        # integration tests need a local FastF1 cache (F1 timing data requires an F1TV login)
        run: pytest -m "not integration" -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pitwall/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pitwall/frontend/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
